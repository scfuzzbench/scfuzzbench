name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      tf_args:
        description: "Extra Terraform arguments passed via TF_ARGS"
        required: false
        default: ""
      existing_bucket:
        description: "Existing S3 bucket name (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scfuzzbench-shared-terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ (inputs.action == 'apply' || inputs.action == 'destroy') && 'production' || 'plan' }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Ensure AWS credentials are configured
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets." >&2
            exit 1
          fi

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure no benchmark instances are active
        if: ${{ inputs.action == 'apply' }}
        run: |
          set -euo pipefail
          active_instances=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=scfuzzbench" \
              "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)
          if [[ "$(jq 'length' <<<"${active_instances}")" != "0" ]]; then
            echo "A benchmark still has active instances; refusing Terraform ${INPUT_ACTION}." >&2
            jq -r '.[]' <<<"${active_instances}" >&2
            exit 1
          fi
        env:
          INPUT_ACTION: ${{ inputs.action }}

      - name: Write backend config from secret
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [ -n "${TF_BACKEND_CONFIG}" ]; then
            printf '%s' "${TF_BACKEND_CONFIG}" > infrastructure/backend.hcl
          fi

      - name: Ensure backend config exists
        run: |
          if [ ! -f infrastructure/backend.hcl ]; then
            echo "Missing infrastructure/backend.hcl. Create it or set TF_BACKEND_CONFIG secret." >&2
            exit 1
          fi

      - name: Terraform init (remote backend)
        run: make terraform-init-backend BACKEND_CONFIG=backend.hcl

      - name: Terraform ${{ inputs.action }}
        env:
          TF_ARGS: ${{ inputs.tf_args }}
          EXISTING_BUCKET: ${{ inputs.existing_bucket }}
        run: |
          case "${{ inputs.action }}" in
            plan)
              make terraform-plan
              ;;
            apply)
              make terraform-deploy
              ;;
            destroy)
              make terraform-destroy
              ;;
          esac
