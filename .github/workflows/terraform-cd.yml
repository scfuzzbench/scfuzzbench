name: Terraform Run Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - destroy
        default: plan
      run_id:
        description: "Immutable run ID to inspect or clean up."
        required: true

permissions:
  contents: read

jobs:
  authorize-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted main ref
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_VALUE}" != "refs/heads/main" ]]; then
            echo "Privileged benchmark workflows may run only from refs/heads/main." >&2
            exit 1
          fi

  terraform:
    needs: authorize-main
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'destroy' && 'production' || 'plan' }}
    concurrency:
      group: scfuzzbench-run-${{ inputs.run_id }}
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Ensure AWS credentials are configured
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets." >&2
            exit 1
          fi
          if [ -z "${SCFUZZBENCH_BUCKET}" ]; then
            echo "Set SCFUZZBENCH_BUCKET to the pre-existing shared artifact bucket." >&2
            exit 1
          fi

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch and verify trusted same-run recovery inputs
        id: recovery
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          backend_key=$(python3 - "${RUN_ID}" <<'PY'
          import sys
          from scripts.benchmark_run_state import backend_key_for

          print(backend_key_for(sys.argv[1]))
          PY
          )
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/runs/${RUN_ID}/cleanup.auto.tfvars.json" \
            "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            --only-show-errors
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/admissions/active/${RUN_ID}.json" \
            "${RUNNER_TEMP}/active-metadata.json" \
            --only-show-errors
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-recovery-inputs \
            --tfvars-json "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            --metadata-json "${RUNNER_TEMP}/active-metadata.json" \
            --run-id "${RUN_ID}" \
            --backend-key "${backend_key}" \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --github-output "${GITHUB_OUTPUT}"
          echo "backend_key=${backend_key}" >> "${GITHUB_OUTPUT}"

      - name: Prove provisioning commit belongs to current main
        env:
          CURRENT_MAIN_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROVISIONING_COMMIT: ${{ steps.recovery.outputs.scfuzzbench_commit }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          compare_url="${GITHUB_API_URL}/repos/${REPO}/compare/${PROVISIONING_COMMIT}...${CURRENT_MAIN_COMMIT}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${compare_url}" \
            -o "${RUNNER_TEMP}/provisioning-compare-raw.json"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPO}/commits/${CURRENT_MAIN_COMMIT}" \
            -o "${RUNNER_TEMP}/current-main-commit.json"
          jq --slurpfile head "${RUNNER_TEMP}/current-main-commit.json" \
            '.head_commit = $head[0]' \
            "${RUNNER_TEMP}/provisioning-compare-raw.json" \
            > "${RUNNER_TEMP}/provisioning-compare.json"
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-provisioning-commit \
            --provisioning-commit "${PROVISIONING_COMMIT}" \
            --current-main-commit "${CURRENT_MAIN_COMMIT}" \
            --compare-json "${RUNNER_TEMP}/provisioning-compare.json"

      - name: Fetch exact provisioning source
        env:
          PROVISIONING_COMMIT: ${{ steps.recovery.outputs.scfuzzbench_commit }}
          REPO: ${{ github.repository }}
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${TF_BACKEND_CONFIG}" ]]; then
            echo "TF_BACKEND_CONFIG must configure the pre-existing state backend." >&2
            exit 1
          fi
          archive="${RUNNER_TEMP}/provisioning-source.tar.gz"
          url="https://codeload.github.com/${REPO}/tar.gz/${PROVISIONING_COMMIT}"
          curl -fsSL "${url}" -o "${archive}"
          mkdir provisioning-source
          tar -xzf "${archive}" -C provisioning-source --strip-components=1
          test -d provisioning-source/infrastructure
          cp "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            provisioning-source/infrastructure/cleanup.auto.tfvars.json
          printf '%s' "${TF_BACKEND_CONFIG}" \
            > provisioning-source/infrastructure/backend.hcl

      - name: Initialize exact provisioning source and same-run state
        env:
          TERRAFORM_BACKEND_KEY: ${{ steps.recovery.outputs.backend_key }}
        run: |
          set -euo pipefail
          terraform -chdir=provisioning-source/infrastructure init \
            -reconfigure \
            -input=false \
            -backend-config=backend.hcl \
            -backend-config="key=${TERRAFORM_BACKEND_KEY}"

      - name: Require exact same-run state outputs
        env:
          ACTION: ${{ inputs.action }}
          EXPECTED_BACKEND_KEY: ${{ steps.recovery.outputs.backend_key }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          state_resources=$(terraform -chdir=provisioning-source/infrastructure state list -no-color)
          if [[ -z "${state_resources}" ]]; then
            echo "Run ${RUN_ID} has no state resources; use Benchmark Run Cleanup to release an empty reservation." >&2
            exit 1
          fi
          validation_args=()
          if [[ "${ACTION}" == "destroy" ]]; then
            validation_args+=(--allow-missing)
          fi
          if ! terraform -chdir=provisioning-source/infrastructure output -json > state-outputs.json; then
            if [[ "${ACTION}" != "destroy" ]]; then
              exit 1
            fi
            echo '{}' > state-outputs.json
          fi
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-state-outputs \
            --outputs-json state-outputs.json \
            --run-id "${RUN_ID}" \
            --backend-key "${EXPECTED_BACKEND_KEY}" \
            "${validation_args[@]}"

      - name: Build and verify Terraform ${{ inputs.action }} plan
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            plan)
              terraform -chdir=provisioning-source/infrastructure plan \
                -input=false \
                -var-file=cleanup.auto.tfvars.json \
                -out=recovery.tfplan
              terraform -chdir=provisioning-source/infrastructure show -json recovery.tfplan > recovery.tfplan.json
              python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-plan \
                --plan-json recovery.tfplan.json \
                --mode inspect \
                --run-id "${RUN_ID}"
              ;;
            destroy)
              terraform -chdir=provisioning-source/infrastructure plan \
                -destroy \
                -input=false \
                -var-file=cleanup.auto.tfvars.json \
                -out=cleanup.tfplan
              terraform -chdir=provisioning-source/infrastructure show -json cleanup.tfplan > cleanup.tfplan.json
              python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-plan \
                --plan-json cleanup.tfplan.json \
                --mode cleanup \
                --run-id "${RUN_ID}"
              ;;
          esac

      - name: Apply the verified same-run destroy plan
        if: ${{ inputs.action == 'destroy' }}
        run: terraform -chdir=provisioning-source/infrastructure apply -auto-approve -input=false cleanup.tfplan

      - name: Release recovered run capacity
        if: ${{ inputs.action == 'destroy' }}
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          remaining=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=scfuzzbench" \
              "Name=tag:RunId,Values=${RUN_ID}" \
              "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)
          if [[ "$(jq 'length' <<<"${remaining}")" != "0" ]]; then
            echo "Run ${RUN_ID} still has active instances; preserving its reservation." >&2
            jq -r '.[]' <<<"${remaining}" >&2
            exit 1
          fi
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" mark-cleaned \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --reason manual-recovery \
            --output run-state-metadata.json
