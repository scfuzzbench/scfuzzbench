name: Terraform Run Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - destroy
        default: plan
      run_id:
        description: "Immutable run ID to inspect or clean up."
        required: true
      tf_args:
        description: "Extra Terraform arguments passed via TF_ARGS"
        required: false
        default: ""
      existing_bucket:
        description: "Pre-existing shared artifact bucket."
        required: true

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'destroy' && 'production' || 'plan' }}
    concurrency:
      group: scfuzzbench-run-${{ inputs.run_id }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ inputs.existing_bucket }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Ensure AWS credentials are configured
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets." >&2
            exit 1
          fi

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write backend config from secret
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [ -n "${TF_BACKEND_CONFIG}" ]; then
            printf '%s' "${TF_BACKEND_CONFIG}" > infrastructure/backend.hcl
          fi

      - name: Ensure backend config exists
        run: |
          if [ ! -f infrastructure/backend.hcl ]; then
            echo "Missing infrastructure/backend.hcl. Create it or set TF_BACKEND_CONFIG secret." >&2
            exit 1
          fi

      - name: Terraform init (remote backend)
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          backend_key=$(python3 - "${RUN_ID}" <<'PY'
          import sys
          from scripts.benchmark_run_state import backend_key_for

          print(backend_key_for(sys.argv[1]))
          PY
          )
          make terraform-init-backend \
            BACKEND_CONFIG=backend.hcl \
            BACKEND_KEY="${backend_key}" \
            BACKEND_INIT_FLAGS="-reconfigure -input=false"

      - name: Fetch same-run recovery inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/runs/${RUN_ID}/cleanup.auto.tfvars.json" \
            infrastructure/cleanup.auto.tfvars.json \
            --only-show-errors

      - name: Terraform ${{ inputs.action }} for this run
        env:
          TF_ARGS: ${{ inputs.tf_args }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          read -r -a extra_args <<< "${TF_ARGS}"
          case "${{ inputs.action }}" in
            plan)
              terraform -chdir=infrastructure plan \
                -input=false \
                -var-file=cleanup.auto.tfvars.json \
                "${extra_args[@]}"
              ;;
            destroy)
              terraform -chdir=infrastructure plan \
                -destroy \
                -input=false \
                -var-file=cleanup.auto.tfvars.json \
                -out=cleanup.tfplan \
                "${extra_args[@]}"
              terraform -chdir=infrastructure show -json cleanup.tfplan > cleanup.tfplan.json
              python3 scripts/benchmark_run_state.py validate-plan \
                --plan-json cleanup.tfplan.json \
                --mode cleanup \
                --run-id "${RUN_ID}"
              terraform -chdir=infrastructure apply -auto-approve -input=false cleanup.tfplan
              ;;
          esac

      - name: Release recovered run capacity
        if: ${{ inputs.action == 'destroy' }}
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          remaining=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=scfuzzbench" \
              "Name=tag:RunId,Values=${RUN_ID}" \
              "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)
          if [[ "$(jq 'length' <<<"${remaining}")" != "0" ]]; then
            echo "Run ${RUN_ID} still has active instances; preserving its reservation." >&2
            jq -r '.[]' <<<"${remaining}" >&2
            exit 1
          fi
          python3 scripts/benchmark_run_state.py mark-cleaned \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --reason manual-recovery \
            --output run-state-metadata.json
