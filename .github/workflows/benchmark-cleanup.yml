name: Benchmark Run Cleanup

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional run ID to inspect or recover."
        required: false
        default: ""
      force_orphan_cleanup:
        description: "Permit cleanup before normal terminal evidence (same-run resources only)."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: read

jobs:
  authorize-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted main ref
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_VALUE}" != "refs/heads/main" ]]; then
            echo "Privileged benchmark workflows may run only from refs/heads/main." >&2
            exit 1
          fi

  discover:
    needs: authorize-main
    runs-on: ubuntu-latest
    outputs:
      has_runs: ${{ steps.discover.outputs.has_runs }}
      matrix: ${{ steps.discover.outputs.matrix }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Ensure shared infrastructure is configured
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${SCFUZZBENCH_BUCKET}" ]]; then
            echo "Set SCFUZZBENCH_BUCKET to the pre-existing shared artifact bucket." >&2
            exit 1
          fi
          if [[ -z "${TF_BACKEND_CONFIG}" ]]; then
            echo "Set TF_BACKEND_CONFIG for the pre-existing state backend." >&2
            exit 1
          fi

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover terminal and orphaned runs
        id: discover
        env:
          FORCE_ORPHAN_CLEANUP: ${{ inputs.force_orphan_cleanup || 'false' }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          discover_args=()
          if [[ -n "${REQUESTED_RUN_ID}" ]]; then
            discover_args+=(--requested-run-id "${REQUESTED_RUN_ID}")
          fi
          if [[ "${FORCE_ORPHAN_CLEANUP}" == "true" ]]; then
            if [[ -z "${REQUESTED_RUN_ID}" ]]; then
              echo "A validated run_id is required for forced cleanup." >&2
              exit 1
            fi
            discover_args+=(--force-run-id "${REQUESTED_RUN_ID}")
          fi
          matrix=$(python3 scripts/benchmark_run_state.py discover-cleanup \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            "${discover_args[@]}")
          if [[ "${matrix}" == '{"include":[]}' ]]; then
            echo "has_runs=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_runs=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  cleanup:
    needs: [authorize-main, discover]
    if: ${{ needs.discover.outputs.has_runs == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: scfuzzbench-run-${{ matrix.run_id }}
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Recheck exact reservation after acquiring run lock
        id: reservation
        env:
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" reservation-exists \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Note already-cleaned queued run
        if: ${{ steps.reservation.outputs.active != 'true' }}
        env:
          RUN_ID: ${{ matrix.run_id }}
        run: |
          echo "Run ${RUN_ID} was already cleaned by an earlier queued job." \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify run identity and fetch trusted recovery inputs
        if: ${{ steps.reservation.outputs.active == 'true' }}
        id: recovery
        env:
          EXPECTED_BACKEND_KEY: ${{ matrix.terraform_backend_key }}
          EXPECTED_COMMIT: ${{ matrix.scfuzzbench_commit }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/runs/${RUN_ID}/cleanup.auto.tfvars.json" \
            "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            --only-show-errors
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/admissions/active/${RUN_ID}.json" \
            "${RUNNER_TEMP}/active-metadata.json" \
            --only-show-errors
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-recovery-inputs \
            --tfvars-json "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            --metadata-json "${RUNNER_TEMP}/active-metadata.json" \
            --run-id "${RUN_ID}" \
            --backend-key "${EXPECTED_BACKEND_KEY}" \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Prove provisioning commit belongs to current main
        if: ${{ steps.reservation.outputs.active == 'true' }}
        env:
          CURRENT_MAIN_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PROVISIONING_COMMIT: ${{ steps.recovery.outputs.scfuzzbench_commit }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          compare_url="${GITHUB_API_URL}/repos/${REPO}/compare/${PROVISIONING_COMMIT}...${CURRENT_MAIN_COMMIT}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${compare_url}" \
            -o "${RUNNER_TEMP}/provisioning-compare-raw.json"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPO}/commits/${CURRENT_MAIN_COMMIT}" \
            -o "${RUNNER_TEMP}/current-main-commit.json"
          jq --slurpfile head "${RUNNER_TEMP}/current-main-commit.json" \
            '.head_commit = $head[0]' \
            "${RUNNER_TEMP}/provisioning-compare-raw.json" \
            > "${RUNNER_TEMP}/provisioning-compare.json"
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-provisioning-commit \
            --provisioning-commit "${PROVISIONING_COMMIT}" \
            --current-main-commit "${CURRENT_MAIN_COMMIT}" \
            --compare-json "${RUNNER_TEMP}/provisioning-compare.json"

      - name: Fetch exact provisioning source
        if: ${{ steps.reservation.outputs.active == 'true' }}
        env:
          PROVISIONING_COMMIT: ${{ steps.recovery.outputs.scfuzzbench_commit }}
          REPO: ${{ github.repository }}
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/provisioning-source.tar.gz"
          url="https://codeload.github.com/${REPO}/tar.gz/${PROVISIONING_COMMIT}"
          curl -fsSL "${url}" -o "${archive}"
          mkdir provisioning-source
          tar -xzf "${archive}" -C provisioning-source --strip-components=1
          test -d provisioning-source/infrastructure
          cp "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            provisioning-source/infrastructure/cleanup.auto.tfvars.json
          printf '%s' "${TF_BACKEND_CONFIG}" \
            > provisioning-source/infrastructure/backend.hcl

      - name: Initialize only this run state from provisioning source
        if: ${{ steps.reservation.outputs.active == 'true' }}
        env:
          TERRAFORM_BACKEND_KEY: ${{ matrix.terraform_backend_key }}
        run: |
          set -euo pipefail
          terraform -chdir=provisioning-source/infrastructure init \
            -reconfigure \
            -input=false \
            -backend-config=backend.hcl \
            -backend-config="key=${TERRAFORM_BACKEND_KEY}"

      - name: Inspect run state
        if: ${{ steps.reservation.outputs.active == 'true' }}
        id: state
        env:
          ALLOW_PARTIAL_STATE: ${{ matrix.reason == 'forced-orphan-cleanup' || matrix.status == 'provisioning-failed' }}
          BENCHMARK_UUID: ${{ matrix.benchmark_uuid }}
          EXPECTED_BACKEND_KEY: ${{ matrix.terraform_backend_key }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          state_resources=$(terraform -chdir=provisioning-source/infrastructure state list 2>state-list.err || true)
          if [[ -s state-list.err ]] && ! grep -q "No state file was found" state-list.err; then
            cat state-list.err >&2
            exit 1
          fi
          if [[ -z "${state_resources}" ]]; then
            echo "has_state=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "has_state=true" >> "${GITHUB_OUTPUT}"
          validation_args=()
          if [[ "${ALLOW_PARTIAL_STATE}" == "true" ]]; then
            validation_args+=(--allow-missing)
          fi
          if ! terraform -chdir=provisioning-source/infrastructure output -json > state-outputs.json; then
            if [[ "${ALLOW_PARTIAL_STATE}" != "true" ]]; then
              exit 1
            fi
            echo '{}' > state-outputs.json
          fi
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-state-outputs \
            --outputs-json state-outputs.json \
            --run-id "${RUN_ID}" \
            --backend-key "${EXPECTED_BACKEND_KEY}" \
            --benchmark-uuid "${BENCHMARK_UUID}" \
            "${validation_args[@]}"

      - name: Build and verify run-scoped destroy plan
        if: ${{ steps.reservation.outputs.active == 'true' && steps.state.outputs.has_state == 'true' }}
        env:
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          terraform -chdir=provisioning-source/infrastructure plan \
            -destroy \
            -input=false \
            -var-file=cleanup.auto.tfvars.json \
            -out=cleanup.tfplan
          terraform -chdir=provisioning-source/infrastructure show -json cleanup.tfplan > cleanup.tfplan.json
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" validate-plan \
            --plan-json cleanup.tfplan.json \
            --mode cleanup \
            --run-id "${RUN_ID}"

      - name: Destroy only the verified run plan
        if: ${{ steps.reservation.outputs.active == 'true' && steps.state.outputs.has_state == 'true' }}
        run: terraform -chdir=provisioning-source/infrastructure apply -auto-approve -input=false cleanup.tfplan

      - name: Verify no same-run instances remain
        if: ${{ steps.reservation.outputs.active == 'true' }}
        env:
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          remaining=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=scfuzzbench" \
              "Name=tag:RunId,Values=${RUN_ID}" \
              "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)
          if [[ "$(jq 'length' <<<"${remaining}")" != "0" ]]; then
            echo "Run ${RUN_ID} still has active instances; preserving its reservation." >&2
            jq -r '.[]' <<<"${remaining}" >&2
            exit 1
          fi

      - name: Archive cleanup result and release capacity
        if: ${{ steps.reservation.outputs.active == 'true' }}
        env:
          CLEANUP_REASON: ${{ matrix.reason }}
          RUN_ID: ${{ matrix.run_id }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/benchmark_run_state.py" mark-cleaned \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --reason "${CLEANUP_REASON}" \
            --output run-state-metadata.json
          {
            echo "Benchmark run cleanup completed."
            echo ""
            echo "- Run ID: ${RUN_ID}"
            echo "- Reason: ${CLEANUP_REASON}"
            echo "- State retained at: ${{ matrix.terraform_backend_key }}"
          } >> "${GITHUB_STEP_SUMMARY}"
