name: Benchmark Run

on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: "Target repository URL."
        required: true
      target_commit:
        description: "Target repository commit hash."
        required: true
      benchmark_type:
        description: "Benchmark type."
        required: true
        type: choice
        options:
          - property
          - optimization
        default: property
      instance_type:
        description: "EC2 instance type."
        required: true
        default: c6a.8xlarge
      instances_per_fuzzer:
        description: "Number of instances per fuzzer."
        required: true
        type: number
        default: 10
      timeout_hours:
        description: "Timeout per fuzzer run (hours)."
        required: true
        type: number
        default: 24
      fuzzers_json:
        description: "JSON list of fuzzer keys to run (optional)."
        required: false
        default: '["echidna","medusa","foundry","recon-fuzzer"]'
      foundry_version:
        description: "Override Foundry version (optional)."
        required: false
        default: ""
      foundry_git_repo:
        description: "Optional Foundry git repo override (build from source; defaults to upstream foundry-rs/foundry via Terraform)."
        required: false
        default: ""
      foundry_git_ref:
        description: "Optional Foundry git ref override (branch/tag/commit; defaults to the pinned upstream commit via Terraform)."
        required: false
        default: ""
      echidna_version:
        description: "Override Echidna version (optional)."
        required: false
        default: ""
      medusa_version:
        description: "Override Medusa version (optional)."
        required: false
        default: ""
      recon_version:
        description: "Override Recon Fuzzer version (optional)."
        required: false
        default: ""
      git_token_ssm_parameter_name:
        description: "SSM parameter name for Git token (optional)."
        required: false
        default: ""
      properties_path:
        description: "Repo-relative properties path for benchmark mode switching (optional)."
        required: false
        default: ""
      fuzzer_env_json:
        description: "JSON map of extra fuzzer env vars (optional)."
        required: false
        default: ""
      dry_run:
        description: "Validate inputs only; skip Terraform apply and infrastructure changes."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      target_repo_url:
        description: "Target repository URL."
        required: true
        type: string
      target_commit:
        description: "Target repository commit hash."
        required: true
        type: string
      benchmark_type:
        description: "Benchmark type."
        required: false
        type: string
        default: property
      instance_type:
        description: "EC2 instance type."
        required: false
        type: string
        default: c6a.8xlarge
      instances_per_fuzzer:
        description: "Number of instances per fuzzer."
        required: false
        type: number
        default: 10
      timeout_hours:
        description: "Timeout per fuzzer run (hours)."
        required: false
        type: number
        default: 24
      fuzzers_json:
        description: "JSON list of fuzzer keys to run (optional)."
        required: false
        type: string
        default: '["echidna","medusa","foundry","recon-fuzzer"]'
      foundry_version:
        description: "Override Foundry version (optional)."
        required: false
        type: string
        default: ""
      foundry_git_repo:
        description: "Optional Foundry git repo override (build from source; defaults to upstream foundry-rs/foundry via Terraform)."
        required: false
        type: string
        default: ""
      foundry_git_ref:
        description: "Optional Foundry git ref override (branch/tag/commit; defaults to the pinned upstream commit via Terraform)."
        required: false
        type: string
        default: ""
      echidna_version:
        description: "Override Echidna version (optional)."
        required: false
        type: string
        default: ""
      medusa_version:
        description: "Override Medusa version (optional)."
        required: false
        type: string
        default: ""
      recon_version:
        description: "Override Recon Fuzzer version (optional)."
        required: false
        type: string
        default: ""
      git_token_ssm_parameter_name:
        description: "SSM parameter name for Git token (optional)."
        required: false
        type: string
        default: ""
      properties_path:
        description: "Repo-relative properties path for benchmark mode switching (optional)."
        required: false
        type: string
        default: ""
      fuzzer_env_json:
        description: "JSON map of extra fuzzer env vars (optional)."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Validate inputs only; skip Terraform apply and infrastructure changes."
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      SCFUZZBENCH_BUCKET:
        required: true
      TF_BACKEND_CONFIG:
        required: true
      AWS_REGION:
        required: false
    outputs:
      run_id:
        description: "Immutable run ID generated before Terraform init."
        value: ${{ jobs.benchmark-run.outputs.run_id }}
      benchmark_uuid:
        description: "Benchmark UUID (derived from manifest)."
        value: ${{ jobs.benchmark-run.outputs.benchmark_uuid }}

permissions:
  contents: read

jobs:
  prepare-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      run_started_at_epoch: ${{ steps.identity.outputs.run_started_at_epoch }}
      terraform_backend_key: ${{ steps.identity.outputs.terraform_backend_key }}
      reservation_key: ${{ steps.identity.outputs.reservation_key }}
      metadata_key: ${{ steps.identity.outputs.metadata_key }}
      cleanup_tfvars_key: ${{ steps.identity.outputs.cleanup_tfvars_key }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Generate immutable run identity
        id: identity
        env:
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py identity \
            --github-run-id "${GITHUB_RUN_ID_VALUE}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT_VALUE}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate all cloud inputs before admission
        env:
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          FOUNDRY_VERSION: ${{ inputs.foundry_version }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          RECON_VERSION: ${{ inputs.recon_version }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          FUZZER_ENV_JSON: ${{ inputs.fuzzer_env_json }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py validate-inputs

      - name: Require external shared infrastructure
        if: ${{ !inputs.dry_run }}
        env:
          SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${SCFUZZBENCH_BUCKET}" ]]; then
            echo "SCFUZZBENCH_BUCKET must name a pre-existing shared artifact bucket." >&2
            exit 1
          fi
          if [[ -z "${TF_BACKEND_CONFIG}" ]]; then
            echo "TF_BACKEND_CONFIG must configure the pre-existing state bucket and lock table." >&2
            exit 1
          fi

  admission:
    needs: prepare-run
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    concurrency:
      group: scfuzzbench-run-admission
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      MAX_CONCURRENT_RUNS: ${{ vars.SCFUZZBENCH_MAX_CONCURRENT_RUNS || '1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare recoverable run metadata
        env:
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          CLEANUP_TFVARS_KEY: ${{ needs.prepare-run.outputs.cleanup_tfvars_key }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_VERSION: ${{ inputs.foundry_version }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          RECON_VERSION: ${{ inputs.recon_version }}
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
          RUN_STARTED_AT_EPOCH: ${{ needs.prepare-run.outputs.run_started_at_epoch }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TERRAFORM_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          fuzzers_raw = os.environ.get("FUZZERS_JSON", "").strip()
          fuzzers = json.loads(fuzzers_raw or '["echidna","medusa","foundry","recon-fuzzer"]')
          started = int(os.environ["RUN_STARTED_AT_EPOCH"])
          timeout_hours = float(os.environ["TIMEOUT_HOURS"])
          reservation = {
              "schema_version": 1,
              "status": "reserved",
              "run_id": os.environ["RUN_ID"],
              "run_started_at_epoch": started,
              "terraform_backend_key": os.environ["TERRAFORM_BACKEND_KEY"],
              "target_repo_url": os.environ["TARGET_REPO_URL"],
              "target_commit": os.environ["TARGET_COMMIT"],
              "benchmark_type": os.environ["BENCHMARK_TYPE"],
              "instance_type": os.environ["INSTANCE_TYPE"],
              "instances_per_fuzzer": int(os.environ["INSTANCES_PER_FUZZER"]),
              "timeout_hours": timeout_hours,
              "fuzzers": fuzzers,
              "benchmark_uuid": "",
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              # The normal path cleans as soon as all final archives exist and
              # instances are terminal. This deadline is only orphan recovery.
              "orphan_after_epoch": started + math.ceil(timeout_hours * 3600) + 3 * 3600,
          }
          cleanup_tfvars = {
              "aws_region": os.environ["AWS_REGION"],
              "existing_bucket_name": os.environ["SCFUZZBENCH_BUCKET"],
              "target_repo_url": os.environ["TARGET_REPO_URL"],
              "target_commit": os.environ["TARGET_COMMIT"],
              "benchmark_type": os.environ["BENCHMARK_TYPE"],
              "instance_type": os.environ["INSTANCE_TYPE"],
              "instances_per_fuzzer": int(os.environ["INSTANCES_PER_FUZZER"]),
              "timeout_hours": timeout_hours,
              "fuzzers": fuzzers,
              "run_id": os.environ["RUN_ID"],
              "run_started_at_epoch": started,
              "terraform_backend_key": os.environ["TERRAFORM_BACKEND_KEY"],
              "scfuzzbench_commit": os.environ["GITHUB_SHA"],
          }
          # Preserve every non-secret optional apply variable. Fuzzer env values
          # are deliberately not persisted: destroy mode does not need user-data
          # inputs and callers may treat those values as sensitive.
          for env_name, tf_name in {
              "FOUNDRY_VERSION": "foundry_version",
              "FOUNDRY_GIT_REPO": "foundry_git_repo",
              "FOUNDRY_GIT_REF": "foundry_git_ref",
              "ECHIDNA_VERSION": "echidna_version",
              "MEDUSA_VERSION": "medusa_version",
              "RECON_VERSION": "recon_version",
              "GIT_TOKEN_SSM_PARAMETER_NAME": "git_token_ssm_parameter_name",
          }.items():
              value = os.environ.get(env_name, "").strip()
              if value:
                  cleanup_tfvars[tf_name] = value
          Path("reservation.json").write_text(
              json.dumps(reservation, indent=2, sort_keys=True) + "\n"
          )
          Path("cleanup.auto.tfvars.json").write_text(
              json.dumps(cleanup_tfvars, indent=2, sort_keys=True) + "\n"
          )
          PY
          aws s3 cp cleanup.auto.tfvars.json \
            "s3://${SCFUZZBENCH_BUCKET}/${CLEANUP_TFVARS_KEY}" \
            --only-show-errors --content-type application/json

      - name: Atomically reserve repository run capacity
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py admit \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --max-concurrent-runs "${MAX_CONCURRENT_RUNS}" \
            --reservation-file reservation.json
          {
            echo "Run admission reserved."
            echo ""
            echo "- Run ID: ${RUN_ID}"
            echo "- Maximum concurrent runs: ${MAX_CONCURRENT_RUNS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  benchmark-run:
    needs: [prepare-run, admission]
    if: ${{ always() && needs.prepare-run.result == 'success' && (inputs.dry_run || needs.admission.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: scfuzzbench-run-${{ needs.prepare-run.outputs.run_id }}
      cancel-in-progress: false
    outputs:
      run_id: ${{ steps.tf_outputs.outputs.run_id }}
      benchmark_uuid: ${{ steps.tf_outputs.outputs.benchmark_uuid }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Terraform
        if: ${{ !inputs.dry_run }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Ensure AWS credentials are configured
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets." >&2
            exit 1
          fi
          if [ -z "${AWS_REGION}" ]; then
            echo "Set AWS_REGION secret." >&2
            exit 1
          fi
          if [ -z "${SCFUZZBENCH_BUCKET}" ]; then
            echo "Set SCFUZZBENCH_BUCKET secret." >&2
            exit 1
          fi

      - name: Configure AWS credentials (keys)
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure this run identity has no active instances
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          active_instances=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=scfuzzbench" \
              "Name=tag:RunId,Values=${RUN_ID}" \
              "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)
          if [[ "$(jq 'length' <<<"${active_instances}")" != "0" ]]; then
            echo "Run identity ${RUN_ID} already has active instances:" >&2
            jq -r '.[]' <<<"${active_instances}" >&2
            exit 1
          fi

      - name: Write backend config from secret
        if: ${{ !inputs.dry_run }}
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [ -n "${TF_BACKEND_CONFIG}" ]; then
            printf '%s' "${TF_BACKEND_CONFIG}" > infrastructure/backend.hcl
          fi

      - name: Ensure backend config exists
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -f infrastructure/backend.hcl ]; then
            echo "Missing infrastructure/backend.hcl. Create it or set TF_BACKEND_CONFIG secret." >&2
            exit 1
          fi

      - name: Terraform init (remote backend)
        if: ${{ !inputs.dry_run }}
        env:
          TERRAFORM_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
        run: |
          set -euo pipefail
          make terraform-init-backend \
            BACKEND_CONFIG=backend.hcl \
            BACKEND_KEY="${TERRAFORM_BACKEND_KEY}" \
            BACKEND_INIT_FLAGS="-reconfigure -input=false"

      - name: Require a fresh run state
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          existing_state=$(terraform -chdir=infrastructure state list 2>state-list.err || true)
          if [[ -n "${existing_state}" ]]; then
            echo "Fresh run ${RUN_ID} unexpectedly has existing Terraform resources:" >&2
            printf '%s\n' "${existing_state}" >&2
            exit 1
          fi
          if [[ -s state-list.err ]] && ! grep -q "No state file was found" state-list.err; then
            cat state-list.err >&2
            exit 1
          fi

      - name: Validate inputs
        env:
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          FOUNDRY_VERSION: ${{ inputs.foundry_version }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          RECON_VERSION: ${{ inputs.recon_version }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          FUZZER_ENV_JSON: ${{ inputs.fuzzer_env_json }}
        run: |
          set -euo pipefail

          fail() {
            echo "Invalid input: $1" >&2
            exit 1
          }

          is_single_line() {
            [[ "$1" != *$'\n'* && "$1" != *$'\r'* ]]
          }

          # These values are interpolated into Terraform args and later into user-data.
          # Keep them conservative to avoid shell-quoting surprises.
          has_forbidden_chars() {
            local s="$1"
            [[ "$s" == *\"* || "$s" == *"$"* || "$s" == *$'\x60'* || "$s" == *\\* ]]
          }

          require_safe() {
            local name="$1"
            local value="$2"
            if ! is_single_line "$value"; then
              fail "${name} must be a single line"
            fi
            if has_forbidden_chars "$value"; then
              fail "${name} contains a forbidden character (double quote, backslash, dollar sign, or backtick)"
            fi
          }

          require_safe "target_repo_url" "${TARGET_REPO_URL}"
          require_safe "target_commit" "${TARGET_COMMIT}"
          require_safe "benchmark_type" "${BENCHMARK_TYPE}"
          require_safe "instance_type" "${INSTANCE_TYPE}"

          if [[ -n "${FOUNDRY_VERSION}" ]]; then
            require_safe "foundry_version" "${FOUNDRY_VERSION}"
            if [[ ! "${FOUNDRY_VERSION}" =~ ^[A-Za-z0-9._+-]+$ ]]; then
              fail "foundry_version must not contain spaces"
            fi
          fi

          if [[ -n "${FOUNDRY_GIT_REPO}" ]]; then
            require_safe "foundry_git_repo" "${FOUNDRY_GIT_REPO}"
            if [[ ! "${FOUNDRY_GIT_REPO}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
              fail "foundry_git_repo must be https://github.com/<org>/<repo>"
            fi
          fi

          if [[ -n "${FOUNDRY_GIT_REF}" ]]; then
            require_safe "foundry_git_ref" "${FOUNDRY_GIT_REF}"
            if [[ ! "${FOUNDRY_GIT_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              fail "foundry_git_ref must not contain spaces"
            fi
          fi

          if [[ -n "${ECHIDNA_VERSION}" ]]; then
            require_safe "echidna_version" "${ECHIDNA_VERSION}"
          fi
          if [[ -n "${MEDUSA_VERSION}" ]]; then
            require_safe "medusa_version" "${MEDUSA_VERSION}"
          fi
          if [[ -n "${RECON_VERSION}" ]]; then
            require_safe "recon_version" "${RECON_VERSION}"
          fi

          if [[ ! "${TARGET_REPO_URL}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
            fail "target_repo_url must be https://github.com/<org>/<repo>"
          fi

          if [[ ! "${TARGET_COMMIT}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            fail "target_commit must be a commit SHA, tag, or branch (no spaces)"
          fi

          case "${BENCHMARK_TYPE}" in
            property|optimization) ;;
            *) fail "benchmark_type must be property or optimization" ;;
          esac

          if [[ ! "${INSTANCE_TYPE}" =~ ^[a-z0-9]+\.[a-z0-9]+$ ]]; then
            fail "instance_type must look like c6a.4xlarge"
          fi

          if [[ ! "${INSTANCES_PER_FUZZER}" =~ ^[0-9]+$ ]] || (( INSTANCES_PER_FUZZER < 1 )) || (( INSTANCES_PER_FUZZER > 20 )); then
            fail "instances_per_fuzzer must be an integer in [1, 20]"
          fi

          if [[ ! "${TIMEOUT_HOURS}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            fail "timeout_hours must be a number"
          fi
          python3 - <<'PY'
          import os
          hours = float(os.environ["TIMEOUT_HOURS"])
          if hours < 0.25 or hours > 72:
              raise SystemExit("timeout_hours must be in [0.25, 72]")
          PY

          python3 - <<'PY'
          import json
          import os
          import re

          raw = os.environ.get("FUZZERS_JSON", "").strip()
          if not raw:
              raw = '["echidna","medusa","foundry","recon-fuzzer"]'
          try:
              obj = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"fuzzers_json must be valid JSON: {e}")
          if not isinstance(obj, list):
              raise SystemExit("fuzzers_json must be a JSON list")
          if len(obj) < 1:
              raise SystemExit("fuzzers_json must include at least one fuzzer key")
          if len(obj) > 20:
              raise SystemExit("fuzzers_json has too many entries (max 20)")
          key_re = re.compile(r"^[a-z0-9][a-z0-9-]{0,63}$")
          for v in obj:
              if not isinstance(v, str) or not key_re.match(v):
                  raise SystemExit(f"Invalid fuzzer key: {v!r}")
          PY

          if [[ -n "${GIT_TOKEN_SSM_PARAMETER_NAME}" ]]; then
            require_safe "git_token_ssm_parameter_name" "${GIT_TOKEN_SSM_PARAMETER_NAME}"
            if [[ ! "${GIT_TOKEN_SSM_PARAMETER_NAME}" =~ ^/scfuzzbench/[A-Za-z0-9_./-]+$ ]]; then
              fail "git_token_ssm_parameter_name must start with /scfuzzbench/"
            fi
          fi

          if [[ -n "${PROPERTIES_PATH}" ]]; then
            require_safe "properties_path" "${PROPERTIES_PATH}"
            if [[ "${PROPERTIES_PATH}" == /* || "${PROPERTIES_PATH}" == *".."* ]]; then
              fail "properties_path must be repo-relative and must not contain '..'"
            fi
            if [[ ! "${PROPERTIES_PATH}" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              fail "properties_path must not contain spaces"
            fi
          fi

          if [[ -n "${FUZZER_ENV_JSON}" ]]; then
            python3 - <<'PY'
          import json
          import os
          import re
          raw = os.environ["FUZZER_ENV_JSON"]
          try:
              obj = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"Invalid fuzzer_env_json: {e}")
          if not isinstance(obj, dict):
              raise SystemExit("fuzzer_env_json must be a JSON object")
          if len(obj) > 64:
              raise SystemExit("fuzzer_env_json has too many keys (max 64)")
          key_re = re.compile(r"^[A-Z][A-Z0-9_]{0,63}$")
          forbidden = re.compile(r'[\r\n"`$\\\\]')
          for k, v in obj.items():
              if not isinstance(k, str) or not key_re.match(k):
                  raise SystemExit(f"Invalid env key: {k}")
              if not isinstance(v, str):
                  raise SystemExit(f"Env value for {k} must be a string")
              if len(v) > 2000:
                  raise SystemExit(f"Env value for {k} too long (max 2000 chars)")
              if forbidden.search(v):
                  raise SystemExit(f"Env value for {k} contains a forbidden character")
          PY
          fi

      - name: Terraform apply
        id: apply
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          FOUNDRY_VERSION: ${{ inputs.foundry_version }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          RECON_VERSION: ${{ inputs.recon_version }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          FUZZER_ENV_JSON: ${{ inputs.fuzzer_env_json }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
          RUN_STARTED_AT_EPOCH: ${{ needs.prepare-run.outputs.run_started_at_epoch }}
          TERRAFORM_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
        run: |
          set -euo pipefail
          fuzzers="${FUZZERS_JSON:-}"
          if [[ -z "${fuzzers}" ]]; then
            fuzzers='["echidna","medusa","foundry","recon-fuzzer"]'
          fi
          tf_args=(
            -var "aws_region=${AWS_REGION}"
            -var "existing_bucket_name=${SCFUZZBENCH_BUCKET}"
            -var "target_repo_url=${TARGET_REPO_URL}"
            -var "target_commit=${TARGET_COMMIT}"
            -var "benchmark_type=${BENCHMARK_TYPE}"
            -var "instance_type=${INSTANCE_TYPE}"
            -var "instances_per_fuzzer=${INSTANCES_PER_FUZZER}"
            -var "timeout_hours=${TIMEOUT_HOURS}"
            -var "fuzzers=${fuzzers}"
            -var "run_id=${RUN_ID}"
            -var "run_started_at_epoch=${RUN_STARTED_AT_EPOCH}"
            -var "terraform_backend_key=${TERRAFORM_BACKEND_KEY}"
            -var "scfuzzbench_commit=${GITHUB_SHA}"
          )

          if [[ -n "${FOUNDRY_VERSION}" ]]; then
            tf_args+=(-var "foundry_version=${FOUNDRY_VERSION}")
          fi
          if [[ -n "${FOUNDRY_GIT_REPO}" ]]; then
            tf_args+=(-var "foundry_git_repo=${FOUNDRY_GIT_REPO}")
          fi
          if [[ -n "${FOUNDRY_GIT_REF}" ]]; then
            tf_args+=(-var "foundry_git_ref=${FOUNDRY_GIT_REF}")
          fi
          if [[ -n "${ECHIDNA_VERSION}" ]]; then
            tf_args+=(-var "echidna_version=${ECHIDNA_VERSION}")
          fi
          if [[ -n "${MEDUSA_VERSION}" ]]; then
            tf_args+=(-var "medusa_version=${MEDUSA_VERSION}")
          fi
          if [[ -n "${RECON_VERSION}" ]]; then
            tf_args+=(-var "recon_version=${RECON_VERSION}")
          fi
          if [[ -n "${GIT_TOKEN_SSM_PARAMETER_NAME}" ]]; then
            tf_args+=(-var "git_token_ssm_parameter_name=${GIT_TOKEN_SSM_PARAMETER_NAME}")
          fi

          if [[ -n "${FUZZER_ENV_JSON}" || -n "${PROPERTIES_PATH}" ]]; then
            merged=$(python3 - <<'PY'
          import json
          import os

          data = {}
          raw = os.environ.get("FUZZER_ENV_JSON", "").strip()
          if raw:
              data.update(json.loads(raw))
          prop = os.environ.get("PROPERTIES_PATH", "").strip()
          if prop:
              data["SCFUZZBENCH_PROPERTIES_PATH"] = prop
          print(json.dumps(data))
          PY
            )
            tf_args+=(-var "fuzzer_env=${merged}")
          fi

          terraform -chdir=infrastructure plan \
            -input=false \
            -out=run.tfplan \
            "${tf_args[@]}"
          terraform -chdir=infrastructure show -json run.tfplan > run.tfplan.json
          python3 scripts/benchmark_run_state.py validate-plan \
            --plan-json run.tfplan.json \
            --mode apply \
            --run-id "${RUN_ID}"
          terraform -chdir=infrastructure apply -auto-approve -input=false run.tfplan
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Collect Terraform outputs
        id: tf_outputs
        if: ${{ !inputs.dry_run }}
        env:
          EXPECTED_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
          EXPECTED_RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure output -json > run_metadata.json
          run_id=$(jq -r '.run_id.value' run_metadata.json)
          benchmark_uuid=$(jq -r '.benchmark_uuid.value' run_metadata.json)
          backend_key=$(jq -r '.terraform_backend_key.value' run_metadata.json)
          if [[ "${run_id}" != "${EXPECTED_RUN_ID}" ]]; then
            echo "Terraform output run_id ${run_id} does not match ${EXPECTED_RUN_ID}." >&2
            exit 1
          fi
          if [[ "${backend_key}" != "${EXPECTED_BACKEND_KEY}" ]]; then
            echo "Terraform output backend key ${backend_key} does not match ${EXPECTED_BACKEND_KEY}." >&2
            exit 1
          fi
          {
            echo "run_id=${run_id}"
            echo "benchmark_uuid=${benchmark_uuid}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record running state and recovery outputs
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py mark-running \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --terraform-outputs run_metadata.json \
            --output run-state-metadata.json

      - name: Record recoverable provisioning failure
        if: ${{ failure() && !inputs.dry_run && needs.admission.result == 'success' }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [[ -f scripts/benchmark_run_state.py ]]; then
            python3 scripts/benchmark_run_state.py mark-failed \
              --bucket "${SCFUZZBENCH_BUCKET}" \
              --run-id "${RUN_ID}" \
              --workflow-url "${WORKFLOW_URL}" \
              --output run-state-metadata.json
          fi

      - name: Upload run metadata
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: run-metadata-${{ needs.prepare-run.outputs.run_id }}
          path: |
            run_metadata.json
            run-state-metadata.json

      - name: Summary
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            {
              echo "Benchmark run dry-run validation passed."
              echo ""
              echo "- No Terraform apply was executed."
              echo "- No infrastructure changes were made."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "Benchmark run started."
              echo ""
              echo "- Run ID: ${{ steps.tf_outputs.outputs.run_id }}"
              echo "- Benchmark UUID: ${{ steps.tf_outputs.outputs.benchmark_uuid }}"
              echo "- Terraform backend key: ${{ needs.prepare-run.outputs.terraform_backend_key }}"
              echo "- Cleanup is asynchronous; this job does not wait for the fuzzing duration."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
