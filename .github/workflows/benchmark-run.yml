name: Benchmark Run

on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: "Target repository URL."
        required: true
      target_commit:
        description: "Target repository commit hash."
        required: true
      benchmark_type:
        description: "Benchmark type."
        required: true
        type: choice
        options:
          - property
          - optimization
        default: property
      instance_type:
        description: "EC2 instance type."
        required: true
        default: c6a.8xlarge
      instances_per_fuzzer:
        description: "Number of instances per fuzzer."
        required: true
        type: number
        default: 10
      timeout_hours:
        description: "Timeout per fuzzer run (hours)."
        required: true
        type: number
        default: 24
      preliminary_interval_minutes:
        description: "Preliminary checkpoint interval in minutes (0 disables)."
        required: false
        type: number
        default: 60
      fuzzers_json:
        description: "JSON list of fuzzer keys to run (optional)."
        required: false
        default: '["echidna","medusa","foundry","recon-fuzzer"]'
      foundry_git_repo:
        description: "Optional Foundry git repo override (build from source; defaults to upstream foundry-rs/foundry via Terraform)."
        required: false
        default: ""
      foundry_git_ref:
        description: "Optional Foundry git ref override (branch/tag/commit; defaults to the pinned upstream commit via Terraform)."
        required: false
        default: ""
      echidna_version:
        description: "Override Echidna version (optional)."
        required: false
        default: ""
      echidna_ci_json:
        description: "Optional JSON object with Echidna artifact/SSM/KMS inputs."
        required: false
        default: ""
      medusa_version:
        description: "Override Medusa version (optional)."
        required: false
        default: ""
      medusa_source_json:
        description: "Optional JSON object with medusa_git_* and medusa_go_* source inputs."
        required: false
        default: ""
      recon_version:
        description: "Override Recon Fuzzer version (optional)."
        required: false
        default: ""
      git_token_ssm_parameter_name:
        description: "SSM parameter name for Git token (optional)."
        required: false
        default: ""
      properties_path:
        description: "Repo-relative properties path for benchmark mode switching (optional)."
        required: false
        default: ""
      fuzzer_env_json:
        description: "JSON map of extra fuzzer env vars (optional)."
        required: false
        default: ""
      shared_seed_corpus_source:
        description: "Optional target-relative directory or s3://bucket/prefix shared by all fuzzers."
        required: false
        default: ""
      dry_run:
        description: "Validate inputs only; skip Terraform apply and infrastructure changes."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      target_repo_url:
        description: "Target repository URL."
        required: true
        type: string
      target_commit:
        description: "Target repository commit hash."
        required: true
        type: string
      benchmark_type:
        description: "Benchmark type."
        required: false
        type: string
        default: property
      instance_type:
        description: "EC2 instance type."
        required: false
        type: string
        default: c6a.8xlarge
      instances_per_fuzzer:
        description: "Number of instances per fuzzer."
        required: false
        type: number
        default: 10
      timeout_hours:
        description: "Timeout per fuzzer run (hours)."
        required: false
        type: number
        default: 24
      preliminary_interval_minutes:
        description: "Preliminary checkpoint interval in minutes (0 disables)."
        required: false
        type: number
        default: 60
      fuzzers_json:
        description: "JSON list of fuzzer keys to run (optional)."
        required: false
        type: string
        default: '["echidna","medusa","foundry","recon-fuzzer"]'
      foundry_git_repo:
        description: "Optional Foundry git repo override (build from source; defaults to upstream foundry-rs/foundry via Terraform)."
        required: false
        type: string
        default: ""
      foundry_git_ref:
        description: "Optional Foundry git ref override (branch/tag/commit; defaults to the pinned upstream commit via Terraform)."
        required: false
        type: string
        default: ""
      echidna_version:
        description: "Override Echidna version (optional)."
        required: false
        type: string
        default: ""
      echidna_ci_repo:
        description: "GitHub repo for an opt-in Echidna Actions artifact."
        required: false
        type: string
        default: ""
      echidna_ci_run_id:
        description: "Successful GitHub Actions run ID for Echidna artifact mode."
        required: false
        type: string
        default: ""
      echidna_ci_artifact_name:
        description: "Exact Linux Echidna artifact name."
        required: false
        type: string
        default: ""
      echidna_ci_artifact_sha256:
        description: "Expected Actions artifact ZIP SHA-256."
        required: false
        type: string
        default: ""
      echidna_ci_commit:
        description: "Full head commit expected for the Echidna Actions run."
        required: false
        type: string
        default: ""
      echidna_ci_token_ssm_parameter_name:
        description: "SecureString path containing a token with Actions read access."
        required: false
        type: string
        default: ""
      echidna_ci_token_kms_key_arn:
        description: "Optional exact customer-managed KMS key ARN for the token SecureString."
        required: false
        type: string
        default: ""
      medusa_version:
        description: "Override Medusa version (optional)."
        required: false
        type: string
        default: ""
      medusa_git_repo:
        description: "GitHub repo for an opt-in Medusa source build."
        required: false
        type: string
        default: ""
      medusa_git_ref:
        description: "Medusa source branch/tag/ref."
        required: false
        type: string
        default: ""
      medusa_git_commit:
        description: "Full immutable commit expected for the Medusa ref."
        required: false
        type: string
        default: ""
      medusa_go_version:
        description: "Pinned Go toolchain for Medusa source mode."
        required: false
        type: string
        default: "1.24.0"
      medusa_go_sha256:
        description: "SHA-256 for the official Go linux-amd64 distribution."
        required: false
        type: string
        default: "dea9ca38a0b852a74e81c26134671af7c0fbe65d81b0dc1c5bfe22cf7d4c8858"
      recon_version:
        description: "Override Recon Fuzzer version (optional)."
        required: false
        type: string
        default: ""
      git_token_ssm_parameter_name:
        description: "SSM parameter name for Git token (optional)."
        required: false
        type: string
        default: ""
      properties_path:
        description: "Repo-relative properties path for benchmark mode switching (optional)."
        required: false
        type: string
        default: ""
      fuzzer_env_json:
        description: "JSON map of extra fuzzer env vars (optional)."
        required: false
        type: string
        default: ""
      shared_seed_corpus_source:
        description: "Optional target-relative directory or s3://bucket/prefix shared by all fuzzers."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Validate inputs only; skip Terraform apply and infrastructure changes."
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      SCFUZZBENCH_BUCKET:
        required: true
      TF_BACKEND_CONFIG:
        required: true
      AWS_REGION:
        required: false
    outputs:
      run_id:
        description: "Immutable opaque run ID generated before Terraform init."
        value: ${{ jobs.benchmark-run.outputs.run_id }}
      benchmark_uuid:
        description: "Benchmark UUID (derived from manifest)."
        value: ${{ jobs.benchmark-run.outputs.benchmark_uuid }}

permissions:
  contents: read

jobs:
  authorize-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted main ref
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_VALUE}" != "refs/heads/main" ]]; then
            echo "Privileged benchmark workflows may run only from refs/heads/main." >&2
            exit 1
          fi

  prepare-run:
    needs: authorize-main
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      run_started_at_epoch: ${{ steps.identity.outputs.run_started_at_epoch }}
      terraform_backend_key: ${{ steps.identity.outputs.terraform_backend_key }}
      reservation_key: ${{ steps.identity.outputs.reservation_key }}
      metadata_key: ${{ steps.identity.outputs.metadata_key }}
      cleanup_tfvars_key: ${{ steps.identity.outputs.cleanup_tfvars_key }}
      echidna_ci_repo: ${{ steps.tool_sources.outputs.echidna_ci_repo }}
      echidna_ci_run_id: ${{ steps.tool_sources.outputs.echidna_ci_run_id }}
      echidna_ci_artifact_name: ${{ steps.tool_sources.outputs.echidna_ci_artifact_name }}
      echidna_ci_artifact_sha256: ${{ steps.tool_sources.outputs.echidna_ci_artifact_sha256 }}
      echidna_ci_commit: ${{ steps.tool_sources.outputs.echidna_ci_commit }}
      echidna_ci_token_ssm_parameter_name: ${{ steps.tool_sources.outputs.echidna_ci_token_ssm_parameter_name }}
      echidna_ci_token_kms_key_arn: ${{ steps.tool_sources.outputs.echidna_ci_token_kms_key_arn }}
      medusa_git_repo: ${{ steps.tool_sources.outputs.medusa_git_repo }}
      medusa_git_ref: ${{ steps.tool_sources.outputs.medusa_git_ref }}
      medusa_git_commit: ${{ steps.tool_sources.outputs.medusa_git_commit }}
      medusa_go_version: ${{ steps.tool_sources.outputs.medusa_go_version }}
      medusa_go_sha256: ${{ steps.tool_sources.outputs.medusa_go_sha256 }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Normalize bleeding-edge tool inputs before admission
        id: tool_sources
        env:
          ECHIDNA_CI_JSON: ${{ inputs.echidna_ci_json }}
          MEDUSA_SOURCE_JSON: ${{ inputs.medusa_source_json }}
          CALL_ECHIDNA_CI_REPO: ${{ inputs.echidna_ci_repo }}
          CALL_ECHIDNA_CI_RUN_ID: ${{ inputs.echidna_ci_run_id }}
          CALL_ECHIDNA_CI_ARTIFACT_NAME: ${{ inputs.echidna_ci_artifact_name }}
          CALL_ECHIDNA_CI_ARTIFACT_SHA256: ${{ inputs.echidna_ci_artifact_sha256 }}
          CALL_ECHIDNA_CI_COMMIT: ${{ inputs.echidna_ci_commit }}
          CALL_ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.echidna_ci_token_ssm_parameter_name }}
          CALL_ECHIDNA_CI_TOKEN_KMS_KEY_ARN: ${{ inputs.echidna_ci_token_kms_key_arn }}
          CALL_MEDUSA_GIT_REPO: ${{ inputs.medusa_git_repo }}
          CALL_MEDUSA_GIT_REF: ${{ inputs.medusa_git_ref }}
          CALL_MEDUSA_GIT_COMMIT: ${{ inputs.medusa_git_commit }}
          CALL_MEDUSA_GO_VERSION: ${{ inputs.medusa_go_version }}
          CALL_MEDUSA_GO_SHA256: ${{ inputs.medusa_go_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py normalize-tools \
            --github-output "${GITHUB_OUTPUT}"

      - name: Generate immutable run identity
        id: identity
        env:
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py identity \
            --github-run-id "${GITHUB_RUN_ID_VALUE}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT_VALUE}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate all cloud inputs before admission
        env:
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          PRELIMINARY_INTERVAL_MINUTES: ${{ inputs.preliminary_interval_minutes }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          ECHIDNA_CI_REPO: ${{ steps.tool_sources.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ steps.tool_sources.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ steps.tool_sources.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ steps.tool_sources.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ steps.tool_sources.outputs.echidna_ci_commit }}
          ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME: ${{ steps.tool_sources.outputs.echidna_ci_token_ssm_parameter_name }}
          ECHIDNA_CI_TOKEN_KMS_KEY_ARN: ${{ steps.tool_sources.outputs.echidna_ci_token_kms_key_arn }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          MEDUSA_GIT_REPO: ${{ steps.tool_sources.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ steps.tool_sources.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ steps.tool_sources.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ steps.tool_sources.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ steps.tool_sources.outputs.medusa_go_sha256 }}
          RECON_VERSION: ${{ inputs.recon_version }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          FUZZER_ENV_JSON: ${{ inputs.fuzzer_env_json }}
          SHARED_SEED_CORPUS_SOURCE: ${{ inputs.shared_seed_corpus_source }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py validate-inputs

      - name: Preflight bleeding-edge tool pins before admission
        env:
          ECHIDNA_CI_REPO: ${{ steps.tool_sources.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ steps.tool_sources.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ steps.tool_sources.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ steps.tool_sources.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ steps.tool_sources.outputs.echidna_ci_commit }}
          MEDUSA_GIT_REPO: ${{ steps.tool_sources.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ steps.tool_sources.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ steps.tool_sources.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ steps.tool_sources.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ steps.tool_sources.outputs.medusa_go_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/validate_bleeding_edge_tools.py \
            --echidna-ci-repo "${ECHIDNA_CI_REPO}" \
            --echidna-ci-run-id "${ECHIDNA_CI_RUN_ID}" \
            --echidna-ci-artifact-name "${ECHIDNA_CI_ARTIFACT_NAME}" \
            --echidna-ci-artifact-sha256 "${ECHIDNA_CI_ARTIFACT_SHA256}" \
            --echidna-ci-commit "${ECHIDNA_CI_COMMIT}" \
            --medusa-git-repo "${MEDUSA_GIT_REPO}" \
            --medusa-git-ref "${MEDUSA_GIT_REF}" \
            --medusa-git-commit "${MEDUSA_GIT_COMMIT}" \
            --medusa-go-version "${MEDUSA_GO_VERSION}" \
            --medusa-go-sha256 "${MEDUSA_GO_SHA256}"

      - name: Require external shared infrastructure
        if: ${{ !inputs.dry_run }}
        env:
          SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${SCFUZZBENCH_BUCKET}" ]]; then
            echo "SCFUZZBENCH_BUCKET must name a pre-existing shared artifact bucket." >&2
            exit 1
          fi
          if [[ -z "${TF_BACKEND_CONFIG}" ]]; then
            echo "TF_BACKEND_CONFIG must configure the pre-existing state bucket and lock table." >&2
            exit 1
          fi

  admission:
    needs: [authorize-main, prepare-run]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    concurrency:
      group: scfuzzbench-run-admission
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      MAX_CONCURRENT_RUNS: ${{ vars.SCFUZZBENCH_MAX_CONCURRENT_RUNS || '1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare recoverable run metadata
        env:
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          CLEANUP_TFVARS_KEY: ${{ needs.prepare-run.outputs.cleanup_tfvars_key }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          ECHIDNA_CI_REPO: ${{ needs.prepare-run.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ needs.prepare-run.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ needs.prepare-run.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ needs.prepare-run.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ needs.prepare-run.outputs.echidna_ci_commit }}
          ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME: ${{ needs.prepare-run.outputs.echidna_ci_token_ssm_parameter_name }}
          ECHIDNA_CI_TOKEN_KMS_KEY_ARN: ${{ needs.prepare-run.outputs.echidna_ci_token_kms_key_arn }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          MEDUSA_GIT_REPO: ${{ needs.prepare-run.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ needs.prepare-run.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ needs.prepare-run.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ needs.prepare-run.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ needs.prepare-run.outputs.medusa_go_sha256 }}
          PRELIMINARY_INTERVAL_MINUTES: ${{ inputs.preliminary_interval_minutes }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          RECON_VERSION: ${{ inputs.recon_version }}
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
          RUN_STARTED_AT_EPOCH: ${{ needs.prepare-run.outputs.run_started_at_epoch }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TERRAFORM_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          SHARED_SEED_CORPUS_SOURCE: ${{ inputs.shared_seed_corpus_source }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          fuzzers_raw = os.environ.get("FUZZERS_JSON", "").strip()
          fuzzers = json.loads(fuzzers_raw or '["echidna","medusa","foundry","recon-fuzzer"]')
          started = int(os.environ["RUN_STARTED_AT_EPOCH"])
          timeout_hours = float(os.environ["TIMEOUT_HOURS"])
          preliminary_interval_seconds = int(
              float(os.environ["PRELIMINARY_INTERVAL_MINUTES"]) * 60
          )
          reservation = {
              "schema_version": 1,
              "status": "reserved",
              "run_id": os.environ["RUN_ID"],
              "run_started_at_epoch": started,
              "terraform_backend_key": os.environ["TERRAFORM_BACKEND_KEY"],
              "existing_bucket_name": os.environ["SCFUZZBENCH_BUCKET"],
              "target_repo_url": os.environ["TARGET_REPO_URL"],
              "target_commit": os.environ["TARGET_COMMIT"],
              "benchmark_type": os.environ["BENCHMARK_TYPE"],
              "instance_type": os.environ["INSTANCE_TYPE"],
              "instances_per_fuzzer": int(os.environ["INSTANCES_PER_FUZZER"]),
              "timeout_hours": timeout_hours,
              "preliminary_interval_seconds": preliminary_interval_seconds,
              "fuzzers": fuzzers,
              "shared_seed_corpus_source": os.environ["SHARED_SEED_CORPUS_SOURCE"],
              "scfuzzbench_commit": os.environ["GITHUB_SHA"],
              "benchmark_uuid": "",
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              # The normal path cleans as soon as all final archives exist and
              # instances are terminal. This deadline is only orphan recovery.
              "orphan_after_epoch": started + math.ceil(timeout_hours * 3600) + 3 * 3600,
          }
          cleanup_tfvars = {
              "aws_region": os.environ["AWS_REGION"],
              "existing_bucket_name": os.environ["SCFUZZBENCH_BUCKET"],
              "target_repo_url": os.environ["TARGET_REPO_URL"],
              "target_commit": os.environ["TARGET_COMMIT"],
              "benchmark_type": os.environ["BENCHMARK_TYPE"],
              "instance_type": os.environ["INSTANCE_TYPE"],
              "instances_per_fuzzer": int(os.environ["INSTANCES_PER_FUZZER"]),
              "timeout_hours": timeout_hours,
              "preliminary_interval_seconds": preliminary_interval_seconds,
              "fuzzers": fuzzers,
              "run_id": os.environ["RUN_ID"],
              "run_started_at_epoch": started,
              "terraform_backend_key": os.environ["TERRAFORM_BACKEND_KEY"],
              "scfuzzbench_commit": os.environ["GITHUB_SHA"],
              "shared_seed_corpus_source": os.environ["SHARED_SEED_CORPUS_SOURCE"],
          }
          # Preserve every non-secret optional apply variable. Fuzzer env values
          # are deliberately not persisted: destroy mode does not need user-data
          # inputs and callers may treat those values as sensitive.
          nonsecret_optional_inputs = {}
          for env_name, tf_name in {
              "FOUNDRY_GIT_REPO": "foundry_git_repo",
              "FOUNDRY_GIT_REF": "foundry_git_ref",
              "ECHIDNA_VERSION": "echidna_version",
              "ECHIDNA_CI_REPO": "echidna_ci_repo",
              "ECHIDNA_CI_RUN_ID": "echidna_ci_run_id",
              "ECHIDNA_CI_ARTIFACT_NAME": "echidna_ci_artifact_name",
              "ECHIDNA_CI_ARTIFACT_SHA256": "echidna_ci_artifact_sha256",
              "ECHIDNA_CI_COMMIT": "echidna_ci_commit",
              "ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME": "echidna_ci_token_ssm_parameter_name",
              "ECHIDNA_CI_TOKEN_KMS_KEY_ARN": "echidna_ci_token_kms_key_arn",
              "MEDUSA_VERSION": "medusa_version",
              "MEDUSA_GIT_REPO": "medusa_git_repo",
              "MEDUSA_GIT_REF": "medusa_git_ref",
              "MEDUSA_GIT_COMMIT": "medusa_git_commit",
              "MEDUSA_GO_VERSION": "medusa_go_version",
              "MEDUSA_GO_SHA256": "medusa_go_sha256",
              "PROPERTIES_PATH": "properties_path",
              "RECON_VERSION": "recon_version",
              "GIT_TOKEN_SSM_PARAMETER_NAME": "git_token_ssm_parameter_name",
          }.items():
              value = os.environ.get(env_name, "").strip()
              if value:
                  cleanup_tfvars[tf_name] = value
                  nonsecret_optional_inputs[tf_name] = value
          reservation["nonsecret_optional_inputs"] = nonsecret_optional_inputs
          Path("reservation.json").write_text(
              json.dumps(reservation, indent=2, sort_keys=True) + "\n"
          )
          Path("cleanup.auto.tfvars.json").write_text(
              json.dumps(cleanup_tfvars, indent=2, sort_keys=True) + "\n"
          )
          PY
          aws s3 cp cleanup.auto.tfvars.json \
            "s3://${SCFUZZBENCH_BUCKET}/${CLEANUP_TFVARS_KEY}" \
            --only-show-errors --content-type application/json

      - name: Atomically reserve repository run capacity
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py admit \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --max-concurrent-runs "${MAX_CONCURRENT_RUNS}" \
            --reservation-file reservation.json
          {
            echo "Run admission reserved."
            echo ""
            echo "- Run ID: ${RUN_ID}"
            echo "- Maximum concurrent runs: ${MAX_CONCURRENT_RUNS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  benchmark-run:
    needs: [authorize-main, prepare-run, admission]
    if: ${{ !cancelled() && needs.authorize-main.result == 'success' && needs.prepare-run.result == 'success' && (inputs.dry_run || needs.admission.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: scfuzzbench-run-${{ needs.prepare-run.outputs.run_id }}
      cancel-in-progress: false
      queue: max
    outputs:
      run_id: ${{ steps.tf_outputs.outputs.run_id }}
      benchmark_uuid: ${{ steps.tf_outputs.outputs.benchmark_uuid }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Reuse pre-admission normalized tool inputs
        id: tool_sources
        env:
          ECHIDNA_CI_REPO: ${{ needs.prepare-run.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ needs.prepare-run.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ needs.prepare-run.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ needs.prepare-run.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ needs.prepare-run.outputs.echidna_ci_commit }}
          ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME: ${{ needs.prepare-run.outputs.echidna_ci_token_ssm_parameter_name }}
          ECHIDNA_CI_TOKEN_KMS_KEY_ARN: ${{ needs.prepare-run.outputs.echidna_ci_token_kms_key_arn }}
          MEDUSA_GIT_REPO: ${{ needs.prepare-run.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ needs.prepare-run.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ needs.prepare-run.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ needs.prepare-run.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ needs.prepare-run.outputs.medusa_go_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          output = {
              key.lower(): value
              for key, value in os.environ.items()
              if key.startswith(("ECHIDNA_CI_", "MEDUSA_"))
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Setup Terraform
        if: ${{ !inputs.dry_run }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Ensure AWS credentials are configured
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets." >&2
            exit 1
          fi
          if [ -z "${AWS_REGION}" ]; then
            echo "Set AWS_REGION secret." >&2
            exit 1
          fi
          if [ -z "${SCFUZZBENCH_BUCKET}" ]; then
            echo "Set SCFUZZBENCH_BUCKET secret." >&2
            exit 1
          fi

      - name: Configure AWS credentials (keys)
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Revalidate reserved run after acquiring run lock
        if: ${{ !inputs.dry_run }}
        env:
          EXPECTED_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/admissions/active/${RUN_ID}.json" \
            "${RUNNER_TEMP}/active-metadata.json" \
            --only-show-errors
          aws s3 cp \
            "s3://${SCFUZZBENCH_BUCKET}/run-state/runs/${RUN_ID}/cleanup.auto.tfvars.json" \
            "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            --only-show-errors
          python3 scripts/benchmark_run_state.py validate-recovery-inputs \
            --tfvars-json "${RUNNER_TEMP}/cleanup.auto.tfvars.json" \
            --metadata-json "${RUNNER_TEMP}/active-metadata.json" \
            --run-id "${RUN_ID}" \
            --backend-key "${EXPECTED_BACKEND_KEY}" \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --expected-status reserved

      - name: Ensure this run identity has no active instances
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          active_instances=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=scfuzzbench" \
              "Name=tag:RunId,Values=${RUN_ID}" \
              "Name=instance-state-name,Values=pending,running,shutting-down,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)
          if [[ "$(jq 'length' <<<"${active_instances}")" != "0" ]]; then
            echo "Run identity ${RUN_ID} already has active instances:" >&2
            jq -r '.[]' <<<"${active_instances}" >&2
            exit 1
          fi

      - name: Write backend config from secret
        if: ${{ !inputs.dry_run }}
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          set -euo pipefail
          if [ -n "${TF_BACKEND_CONFIG}" ]; then
            printf '%s' "${TF_BACKEND_CONFIG}" > infrastructure/backend.hcl
          fi

      - name: Ensure backend config exists
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -f infrastructure/backend.hcl ]; then
            echo "Missing infrastructure/backend.hcl. Create it or set TF_BACKEND_CONFIG secret." >&2
            exit 1
          fi

      - name: Terraform init (remote backend)
        if: ${{ !inputs.dry_run }}
        env:
          TERRAFORM_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
        run: |
          set -euo pipefail
          make terraform-init-backend \
            BACKEND_CONFIG=backend.hcl \
            BACKEND_KEY="${TERRAFORM_BACKEND_KEY}" \
            BACKEND_INIT_FLAGS="-reconfigure -input=false"

      - name: Require a fresh run state
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          existing_state=$(terraform -chdir=infrastructure state list -no-color 2>state-list.err || true)
          if [[ -n "${existing_state}" ]]; then
            echo "Fresh run ${RUN_ID} unexpectedly has existing Terraform resources:" >&2
            printf '%s\n' "${existing_state}" >&2
            exit 1
          fi
          if [[ -s state-list.err ]] && ! grep -q "No state file was found" state-list.err; then
            cat state-list.err >&2
            exit 1
          fi

      - name: Validate inputs
        env:
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          PRELIMINARY_INTERVAL_MINUTES: ${{ inputs.preliminary_interval_minutes }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          ECHIDNA_CI_REPO: ${{ steps.tool_sources.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ steps.tool_sources.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ steps.tool_sources.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ steps.tool_sources.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ steps.tool_sources.outputs.echidna_ci_commit }}
          ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME: ${{ steps.tool_sources.outputs.echidna_ci_token_ssm_parameter_name }}
          ECHIDNA_CI_TOKEN_KMS_KEY_ARN: ${{ steps.tool_sources.outputs.echidna_ci_token_kms_key_arn }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          MEDUSA_GIT_REPO: ${{ steps.tool_sources.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ steps.tool_sources.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ steps.tool_sources.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ steps.tool_sources.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ steps.tool_sources.outputs.medusa_go_sha256 }}
          RECON_VERSION: ${{ inputs.recon_version }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          FUZZER_ENV_JSON: ${{ inputs.fuzzer_env_json }}
          SHARED_SEED_CORPUS_SOURCE: ${{ inputs.shared_seed_corpus_source }}
        run: |
          set -euo pipefail

          fail() {
            echo "Invalid input: $1" >&2
            exit 1
          }

          is_single_line() {
            [[ "$1" != *$'\n'* && "$1" != *$'\r'* ]]
          }

          # These values are interpolated into Terraform args and later into user-data.
          # Keep them conservative to avoid shell-quoting surprises.
          has_forbidden_chars() {
            local s="$1"
            [[ "$s" == *\"* || "$s" == *"$"* || "$s" == *$'\x60'* || "$s" == *\\* ]]
          }

          require_safe() {
            local name="$1"
            local value="$2"
            if ! is_single_line "$value"; then
              fail "${name} must be a single line"
            fi
            if has_forbidden_chars "$value"; then
              fail "${name} contains a forbidden character (double quote, backslash, dollar sign, or backtick)"
            fi
          }

          require_safe "target_repo_url" "${TARGET_REPO_URL}"
          require_safe "target_commit" "${TARGET_COMMIT}"
          require_safe "benchmark_type" "${BENCHMARK_TYPE}"
          require_safe "instance_type" "${INSTANCE_TYPE}"

          if [[ -n "${FOUNDRY_GIT_REPO}" ]]; then
            require_safe "foundry_git_repo" "${FOUNDRY_GIT_REPO}"
            if [[ ! "${FOUNDRY_GIT_REPO}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
              fail "foundry_git_repo must be https://github.com/<org>/<repo>"
            fi
          fi

          if [[ -n "${FOUNDRY_GIT_REF}" ]]; then
            require_safe "foundry_git_ref" "${FOUNDRY_GIT_REF}"
            if [[ ! "${FOUNDRY_GIT_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              fail "foundry_git_ref must not contain spaces"
            fi
          fi

          if [[ -n "${ECHIDNA_VERSION}" ]]; then
            require_safe "echidna_version" "${ECHIDNA_VERSION}"
          fi

          echidna_ci_count=0
          for value in \
            "${ECHIDNA_CI_REPO}" \
            "${ECHIDNA_CI_RUN_ID}" \
            "${ECHIDNA_CI_ARTIFACT_NAME}" \
            "${ECHIDNA_CI_ARTIFACT_SHA256}" \
            "${ECHIDNA_CI_COMMIT}" \
            "${ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME}"; do
            [[ -z "${value}" ]] || echidna_ci_count=$((echidna_ci_count + 1))
          done
          if (( echidna_ci_count != 0 && echidna_ci_count != 6 )); then
            fail "Echidna CI mode requires repo, run ID, artifact name, artifact SHA-256, full commit, and token SSM parameter together"
          fi
          if (( echidna_ci_count == 6 )); then
            [[ -z "${ECHIDNA_VERSION}" ]] || fail "echidna_version and Echidna CI artifact mode are mutually exclusive"
            require_safe "echidna_ci_repo" "${ECHIDNA_CI_REPO}"
            require_safe "echidna_ci_run_id" "${ECHIDNA_CI_RUN_ID}"
            require_safe "echidna_ci_artifact_name" "${ECHIDNA_CI_ARTIFACT_NAME}"
            require_safe "echidna_ci_artifact_sha256" "${ECHIDNA_CI_ARTIFACT_SHA256}"
            require_safe "echidna_ci_commit" "${ECHIDNA_CI_COMMIT}"
            require_safe "echidna_ci_token_ssm_parameter_name" "${ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME}"
            [[ "${ECHIDNA_CI_REPO}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]] \
              || fail "echidna_ci_repo must be https://github.com/<org>/<repo>"
            [[ "${ECHIDNA_CI_RUN_ID}" =~ ^[1-9][0-9]*$ ]] \
              || fail "echidna_ci_run_id must be a positive integer"
            [[ "${ECHIDNA_CI_ARTIFACT_NAME}" =~ ^[A-Za-z0-9._-]+$ && "${ECHIDNA_CI_ARTIFACT_NAME,,}" == *linux* ]] \
              || fail "echidna_ci_artifact_name must be a Linux artifact name without spaces"
            [[ "${ECHIDNA_CI_ARTIFACT_SHA256}" =~ ^[A-Fa-f0-9]{64}$ ]] \
              || fail "echidna_ci_artifact_sha256 must be a 64-character digest"
            [[ "${ECHIDNA_CI_COMMIT}" =~ ^[A-Fa-f0-9]{40}$ ]] \
              || fail "echidna_ci_commit must be a full 40-character SHA"
            [[ "${ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME}" =~ ^/scfuzzbench/[A-Za-z0-9_./-]+$ ]] \
              || fail "echidna_ci_token_ssm_parameter_name must start with /scfuzzbench/"
            if [[ -n "${ECHIDNA_CI_TOKEN_KMS_KEY_ARN}" ]]; then
              require_safe "echidna_ci_token_kms_key_arn" "${ECHIDNA_CI_TOKEN_KMS_KEY_ARN}"
              [[ "${ECHIDNA_CI_TOKEN_KMS_KEY_ARN}" =~ ^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Fa-f0-9-]{36}$ ]] \
                || fail "echidna_ci_token_kms_key_arn must be an exact customer-managed KMS key ARN"
            fi
          fi
          if [[ -n "${ECHIDNA_CI_TOKEN_KMS_KEY_ARN}" ]] && (( echidna_ci_count != 6 )); then
            fail "echidna_ci_token_kms_key_arn requires Echidna CI artifact mode"
          fi

          if [[ -n "${MEDUSA_VERSION}" ]]; then
            require_safe "medusa_version" "${MEDUSA_VERSION}"
          fi

          medusa_source_count=0
          for value in "${MEDUSA_GIT_REPO}" "${MEDUSA_GIT_REF}" "${MEDUSA_GIT_COMMIT}"; do
            [[ -z "${value}" ]] || medusa_source_count=$((medusa_source_count + 1))
          done
          if (( medusa_source_count != 0 && medusa_source_count != 3 )); then
            fail "Medusa source mode requires git repo, git ref, and full commit together"
          fi
          require_safe "medusa_go_version" "${MEDUSA_GO_VERSION}"
          require_safe "medusa_go_sha256" "${MEDUSA_GO_SHA256}"
          [[ "${MEDUSA_GO_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || fail "medusa_go_version must look like 1.24.0"
          [[ "${MEDUSA_GO_SHA256}" =~ ^[A-Fa-f0-9]{64}$ ]] \
            || fail "medusa_go_sha256 must be a 64-character digest"
          if (( medusa_source_count == 3 )); then
            [[ -z "${MEDUSA_VERSION}" ]] || fail "medusa_version and Medusa source mode are mutually exclusive"
            require_safe "medusa_git_repo" "${MEDUSA_GIT_REPO}"
            require_safe "medusa_git_ref" "${MEDUSA_GIT_REF}"
            require_safe "medusa_git_commit" "${MEDUSA_GIT_COMMIT}"
            [[ "${MEDUSA_GIT_REPO}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]] \
              || fail "medusa_git_repo must be https://github.com/<org>/<repo>"
            [[ "${MEDUSA_GIT_REF}" =~ ^[A-Za-z0-9._/-]+$ && "${MEDUSA_GIT_REF}" != -* && "${MEDUSA_GIT_REF}" != *".."* && "${MEDUSA_GIT_REF}" != *"//"* ]] \
              || fail "medusa_git_ref contains unsupported characters"
            [[ "${MEDUSA_GIT_COMMIT}" =~ ^[A-Fa-f0-9]{40}$ ]] \
              || fail "medusa_git_commit must be a full 40-character SHA"
          fi

          if [[ -n "${RECON_VERSION}" ]]; then
            require_safe "recon_version" "${RECON_VERSION}"
          fi

          if [[ ! "${TARGET_REPO_URL}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
            fail "target_repo_url must be https://github.com/<org>/<repo>"
          fi

          if [[ ! "${TARGET_COMMIT}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            fail "target_commit must be a commit SHA, tag, or branch (no spaces)"
          fi

          case "${BENCHMARK_TYPE}" in
            property|optimization) ;;
            *) fail "benchmark_type must be property or optimization" ;;
          esac

          if [[ ! "${INSTANCE_TYPE}" =~ ^[a-z0-9]+\.[a-z0-9]+$ ]]; then
            fail "instance_type must look like c6a.4xlarge"
          fi

          if [[ ! "${INSTANCES_PER_FUZZER}" =~ ^[0-9]+$ ]] || (( INSTANCES_PER_FUZZER < 1 )) || (( INSTANCES_PER_FUZZER > 20 )); then
            fail "instances_per_fuzzer must be an integer in [1, 20]"
          fi

          if [[ ! "${TIMEOUT_HOURS}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            fail "timeout_hours must be a number"
          fi
          python3 - <<'PY'
          import os
          hours = float(os.environ["TIMEOUT_HOURS"])
          if hours < 0.25 or hours > 72:
              raise SystemExit("timeout_hours must be in [0.25, 72]")
          minutes = float(os.environ["PRELIMINARY_INTERVAL_MINUTES"])
          seconds = minutes * 60
          if minutes < 0 or minutes > 1440:
              raise SystemExit("preliminary_interval_minutes must be in [0, 1440]")
          if minutes != 0 and minutes < 1:
              raise SystemExit("preliminary_interval_minutes must be 0 or at least 1")
          if not seconds.is_integer():
              raise SystemExit("preliminary_interval_minutes must resolve to whole seconds")
          PY

          python3 - <<'PY'
          import json
          import os
          import re

          raw = os.environ.get("FUZZERS_JSON", "").strip()
          if not raw:
              raw = '["echidna","medusa","foundry","recon-fuzzer"]'
          try:
              obj = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"fuzzers_json must be valid JSON: {e}")
          if not isinstance(obj, list):
              raise SystemExit("fuzzers_json must be a JSON list")
          if len(obj) < 1:
              raise SystemExit("fuzzers_json must include at least one fuzzer key")
          if len(obj) > 20:
              raise SystemExit("fuzzers_json has too many entries (max 20)")
          key_re = re.compile(r"^[a-z0-9][a-z0-9-]{0,63}$")
          for v in obj:
              if not isinstance(v, str) or not key_re.match(v):
                  raise SystemExit(f"Invalid fuzzer key: {v!r}")
          PY

          if [[ -n "${GIT_TOKEN_SSM_PARAMETER_NAME}" ]]; then
            require_safe "git_token_ssm_parameter_name" "${GIT_TOKEN_SSM_PARAMETER_NAME}"
            if [[ ! "${GIT_TOKEN_SSM_PARAMETER_NAME}" =~ ^/scfuzzbench/[A-Za-z0-9_./-]+$ ]]; then
              fail "git_token_ssm_parameter_name must start with /scfuzzbench/"
            fi
          fi

          if [[ -n "${PROPERTIES_PATH}" ]]; then
            require_safe "properties_path" "${PROPERTIES_PATH}"
            if [[ "${PROPERTIES_PATH}" == /* || "${PROPERTIES_PATH}" == *".."* ]]; then
              fail "properties_path must be repo-relative and must not contain '..'"
            fi
            if [[ ! "${PROPERTIES_PATH}" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              fail "properties_path must not contain spaces"
            fi
          fi

          if [[ -n "${SHARED_SEED_CORPUS_SOURCE}" ]]; then
            require_safe "shared_seed_corpus_source" "${SHARED_SEED_CORPUS_SOURCE}"
            if [[ ! "${SHARED_SEED_CORPUS_SOURCE}" =~ ^(s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/)?[A-Za-z0-9/._+~-]+/?$ ]]; then
              fail "shared_seed_corpus_source must be a safe target-relative path or s3://bucket/prefix"
            fi
            if [[ "/${SHARED_SEED_CORPUS_SOURCE}/" == *"/./"* || "/${SHARED_SEED_CORPUS_SOURCE}/" == *"/../"* ]]; then
              fail "shared_seed_corpus_source must not contain '.' or '..' path segments"
            fi
          fi

          if [[ -n "${FUZZER_ENV_JSON}" ]]; then
            python3 - <<'PY'
          import json
          import os
          from scripts.benchmark_run_state import validate_fuzzer_env_map

          raw = os.environ["FUZZER_ENV_JSON"]
          try:
              obj = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"Invalid fuzzer_env_json: {e}")
          try:
              validate_fuzzer_env_map(obj)
          except ValueError as exc:
              raise SystemExit(str(exc)) from exc
          PY
          fi

      - name: Preflight bleeding-edge tool pins
        env:
          ECHIDNA_CI_REPO: ${{ steps.tool_sources.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ steps.tool_sources.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ steps.tool_sources.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ steps.tool_sources.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ steps.tool_sources.outputs.echidna_ci_commit }}
          MEDUSA_GIT_REPO: ${{ steps.tool_sources.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ steps.tool_sources.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ steps.tool_sources.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ steps.tool_sources.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ steps.tool_sources.outputs.medusa_go_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/validate_bleeding_edge_tools.py \
            --echidna-ci-repo "${ECHIDNA_CI_REPO}" \
            --echidna-ci-run-id "${ECHIDNA_CI_RUN_ID}" \
            --echidna-ci-artifact-name "${ECHIDNA_CI_ARTIFACT_NAME}" \
            --echidna-ci-artifact-sha256 "${ECHIDNA_CI_ARTIFACT_SHA256}" \
            --echidna-ci-commit "${ECHIDNA_CI_COMMIT}" \
            --medusa-git-repo "${MEDUSA_GIT_REPO}" \
            --medusa-git-ref "${MEDUSA_GIT_REF}" \
            --medusa-git-commit "${MEDUSA_GIT_COMMIT}" \
            --medusa-go-version "${MEDUSA_GO_VERSION}" \
            --medusa-go-sha256 "${MEDUSA_GO_SHA256}"

      - name: Terraform apply
        id: apply
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          INSTANCES_PER_FUZZER: ${{ inputs.instances_per_fuzzer }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours }}
          PRELIMINARY_INTERVAL_MINUTES: ${{ inputs.preliminary_interval_minutes }}
          FUZZERS_JSON: ${{ inputs.fuzzers_json }}
          FOUNDRY_GIT_REPO: ${{ inputs.foundry_git_repo }}
          FOUNDRY_GIT_REF: ${{ inputs.foundry_git_ref }}
          ECHIDNA_VERSION: ${{ inputs.echidna_version }}
          ECHIDNA_CI_REPO: ${{ steps.tool_sources.outputs.echidna_ci_repo }}
          ECHIDNA_CI_RUN_ID: ${{ steps.tool_sources.outputs.echidna_ci_run_id }}
          ECHIDNA_CI_ARTIFACT_NAME: ${{ steps.tool_sources.outputs.echidna_ci_artifact_name }}
          ECHIDNA_CI_ARTIFACT_SHA256: ${{ steps.tool_sources.outputs.echidna_ci_artifact_sha256 }}
          ECHIDNA_CI_COMMIT: ${{ steps.tool_sources.outputs.echidna_ci_commit }}
          ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME: ${{ steps.tool_sources.outputs.echidna_ci_token_ssm_parameter_name }}
          ECHIDNA_CI_TOKEN_KMS_KEY_ARN: ${{ steps.tool_sources.outputs.echidna_ci_token_kms_key_arn }}
          MEDUSA_VERSION: ${{ inputs.medusa_version }}
          MEDUSA_GIT_REPO: ${{ steps.tool_sources.outputs.medusa_git_repo }}
          MEDUSA_GIT_REF: ${{ steps.tool_sources.outputs.medusa_git_ref }}
          MEDUSA_GIT_COMMIT: ${{ steps.tool_sources.outputs.medusa_git_commit }}
          MEDUSA_GO_VERSION: ${{ steps.tool_sources.outputs.medusa_go_version }}
          MEDUSA_GO_SHA256: ${{ steps.tool_sources.outputs.medusa_go_sha256 }}
          RECON_VERSION: ${{ inputs.recon_version }}
          GIT_TOKEN_SSM_PARAMETER_NAME: ${{ inputs.git_token_ssm_parameter_name }}
          FUZZER_ENV_JSON: ${{ inputs.fuzzer_env_json }}
          PROPERTIES_PATH: ${{ inputs.properties_path }}
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
          RUN_STARTED_AT_EPOCH: ${{ needs.prepare-run.outputs.run_started_at_epoch }}
          SHARED_SEED_CORPUS_SOURCE: ${{ inputs.shared_seed_corpus_source }}
          TERRAFORM_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
        run: |
          set -euo pipefail
          preliminary_interval_seconds=$(python3 - <<'PY'
          import os
          print(int(float(os.environ["PRELIMINARY_INTERVAL_MINUTES"]) * 60))
          PY
          )
          fuzzers="${FUZZERS_JSON:-}"
          if [[ -z "${fuzzers}" ]]; then
            fuzzers='["echidna","medusa","foundry","recon-fuzzer"]'
          fi
          tf_args=(
            -var "aws_region=${AWS_REGION}"
            -var "existing_bucket_name=${SCFUZZBENCH_BUCKET}"
            -var "target_repo_url=${TARGET_REPO_URL}"
            -var "target_commit=${TARGET_COMMIT}"
            -var "benchmark_type=${BENCHMARK_TYPE}"
            -var "instance_type=${INSTANCE_TYPE}"
            -var "instances_per_fuzzer=${INSTANCES_PER_FUZZER}"
            -var "timeout_hours=${TIMEOUT_HOURS}"
            -var "preliminary_interval_seconds=${preliminary_interval_seconds}"
            -var "fuzzers=${fuzzers}"
            -var "run_id=${RUN_ID}"
            -var "run_started_at_epoch=${RUN_STARTED_AT_EPOCH}"
            -var "terraform_backend_key=${TERRAFORM_BACKEND_KEY}"
            -var "scfuzzbench_commit=${GITHUB_SHA}"
            -var "shared_seed_corpus_source=${SHARED_SEED_CORPUS_SOURCE}"
          )

          if [[ -n "${FOUNDRY_GIT_REPO}" ]]; then
            tf_args+=(-var "foundry_git_repo=${FOUNDRY_GIT_REPO}")
          fi
          if [[ -n "${FOUNDRY_GIT_REF}" ]]; then
            tf_args+=(-var "foundry_git_ref=${FOUNDRY_GIT_REF}")
          fi
          if [[ -n "${ECHIDNA_VERSION}" ]]; then
            tf_args+=(-var "echidna_version=${ECHIDNA_VERSION}")
          fi
          if [[ -n "${ECHIDNA_CI_REPO}" ]]; then
            tf_args+=(
              -var "echidna_ci_repo=${ECHIDNA_CI_REPO}"
              -var "echidna_ci_run_id=${ECHIDNA_CI_RUN_ID}"
              -var "echidna_ci_artifact_name=${ECHIDNA_CI_ARTIFACT_NAME}"
              -var "echidna_ci_artifact_sha256=${ECHIDNA_CI_ARTIFACT_SHA256}"
              -var "echidna_ci_commit=${ECHIDNA_CI_COMMIT}"
              -var "echidna_ci_token_ssm_parameter_name=${ECHIDNA_CI_TOKEN_SSM_PARAMETER_NAME}"
            )
            if [[ -n "${ECHIDNA_CI_TOKEN_KMS_KEY_ARN}" ]]; then
              tf_args+=(-var "echidna_ci_token_kms_key_arn=${ECHIDNA_CI_TOKEN_KMS_KEY_ARN}")
            fi
          fi
          if [[ -n "${MEDUSA_VERSION}" ]]; then
            tf_args+=(-var "medusa_version=${MEDUSA_VERSION}")
          fi
          if [[ -n "${MEDUSA_GIT_REPO}" ]]; then
            tf_args+=(
              -var "medusa_git_repo=${MEDUSA_GIT_REPO}"
              -var "medusa_git_ref=${MEDUSA_GIT_REF}"
              -var "medusa_git_commit=${MEDUSA_GIT_COMMIT}"
              -var "medusa_go_version=${MEDUSA_GO_VERSION}"
              -var "medusa_go_sha256=${MEDUSA_GO_SHA256}"
            )
          fi
          if [[ -n "${RECON_VERSION}" ]]; then
            tf_args+=(-var "recon_version=${RECON_VERSION}")
          fi
          if [[ -n "${GIT_TOKEN_SSM_PARAMETER_NAME}" ]]; then
            tf_args+=(-var "git_token_ssm_parameter_name=${GIT_TOKEN_SSM_PARAMETER_NAME}")
          fi
          if [[ -n "${PROPERTIES_PATH}" ]]; then
            tf_args+=(-var "properties_path=${PROPERTIES_PATH}")
          fi

          if [[ -n "${FUZZER_ENV_JSON}" ]]; then
            tf_args+=(-var "fuzzer_env=${FUZZER_ENV_JSON}")
          fi

          terraform -chdir=infrastructure plan \
            -input=false \
            -out=run.tfplan \
            "${tf_args[@]}"
          terraform -chdir=infrastructure show -json run.tfplan > run.tfplan.json
          python3 scripts/benchmark_run_state.py validate-plan \
            --plan-json run.tfplan.json \
            --mode apply \
            --run-id "${RUN_ID}"
          terraform -chdir=infrastructure apply -auto-approve -input=false run.tfplan
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Collect Terraform outputs
        id: tf_outputs
        if: ${{ !inputs.dry_run }}
        env:
          EXPECTED_BACKEND_KEY: ${{ needs.prepare-run.outputs.terraform_backend_key }}
          EXPECTED_RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure output -json > run_metadata.json
          run_id=$(jq -r '.run_id.value' run_metadata.json)
          benchmark_uuid=$(jq -r '.benchmark_uuid.value' run_metadata.json)
          backend_key=$(jq -r '.terraform_backend_key.value' run_metadata.json)
          if [[ "${run_id}" != "${EXPECTED_RUN_ID}" ]]; then
            echo "Terraform output run_id ${run_id} does not match ${EXPECTED_RUN_ID}." >&2
            exit 1
          fi
          if [[ "${backend_key}" != "${EXPECTED_BACKEND_KEY}" ]]; then
            echo "Terraform output backend key ${backend_key} does not match ${EXPECTED_BACKEND_KEY}." >&2
            exit 1
          fi
          {
            echo "run_id=${run_id}"
            echo "benchmark_uuid=${benchmark_uuid}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record running state and recovery outputs
        if: ${{ !inputs.dry_run }}
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py mark-running \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --terraform-outputs run_metadata.json \
            --output run-state-metadata.json

      - name: Publish preliminary run metadata
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          python3 scripts/preliminary_results.py write-run-manifest \
            --terraform-output run_metadata.json \
            --out preliminary_run.json
          python3 scripts/preliminary_results.py publish-run \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --manifest preliminary_run.json

      - name: Upload run metadata
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: run-metadata-${{ needs.prepare-run.outputs.run_id }}
          path: |
            run_metadata.json
            run-state-metadata.json
            preliminary_run.json

      - name: Summary
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            {
              echo "Benchmark run dry-run validation passed."
              echo ""
              echo "- No Terraform apply was executed."
              echo "- No infrastructure changes were made."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "Benchmark run started."
              echo ""
              echo "- Run ID: ${{ steps.tf_outputs.outputs.run_id }}"
              echo "- Benchmark UUID: ${{ steps.tf_outputs.outputs.benchmark_uuid }}"
              echo "- Terraform backend key: ${{ needs.prepare-run.outputs.terraform_backend_key }}"
              echo "- Preliminary checkpoints: every ${{ inputs.preliminary_interval_minutes }} minute(s) (0 disables)"
              echo "- Cleanup is asynchronous; this job does not wait for the fuzzing duration."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  finalize-failed-run:
    needs: [authorize-main, prepare-run, admission, benchmark-run]
    if: ${{ always() && !inputs.dry_run && needs.authorize-main.result == 'success' && needs.prepare-run.result == 'success' && (needs.admission.result != 'success' || needs.benchmark-run.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: scfuzzbench-run-${{ needs.prepare-run.outputs.run_id }}
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      SCFUZZBENCH_BUCKET: ${{ secrets.SCFUZZBENCH_BUCKET }}
    steps:
      - name: Checkout trusted main source
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Configure AWS credentials (keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Record recoverable provisioning failure
        env:
          RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/benchmark_run_state.py mark-failed-if-reserved \
            --bucket "${SCFUZZBENCH_BUCKET}" \
            --run-id "${RUN_ID}" \
            --workflow-url "${WORKFLOW_URL}" \
            --output run-state-metadata.json
