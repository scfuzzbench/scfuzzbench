name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10

      - name: Lint GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$' \
            .github/workflows/*.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=infrastructure init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infrastructure validate

      - name: Test direct Terraform input boundaries
        run: |
          python3 infrastructure/tests/test_input_boundaries.py
          python3 infrastructure/tests/test_bootstrap_bundle.py

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install \
            boto3==1.34.46 \
            "differential-coverage>=1.1.0" \
            "scipy>=1.10.0"

      - name: Python syntax check
        run: python -m compileall analysis scripts fuzzers/_shared infrastructure

      - name: Run benchmark analysis and state isolation regression tests
        run: |
          python -m unittest \
            analysis.tests.test_analyze_summary \
            analysis.tests.test_analyze_throughput_parser \
            analysis.tests.test_benchmark_run_state \
            analysis.tests.test_resolve_tool_versions \
            analysis.tests.test_workflow_safety_contracts \
            analysis.tests.test_generate_docs_site \
            analysis.tests.test_preliminary_finalized_marker

      - name: Run runner filesystem and bootstrap regressions
        run: |
          python -m unittest \
            analysis.tests.test_safe_path_ops \
            analysis.tests.test_put_manifest_once \
            analysis.tests.test_upload_pinned_file \
            analysis.tests.test_runner_filesystem_safety \
            analysis.tests.test_shared_seed_corpus \
            analysis.tests.test_preliminary_snapshot \
            analysis.tests.test_preliminary_runner_shell \
            analysis.tests.test_echidna_run_shrink_limit \
            analysis.tests.test_recon_run_shrink_limit \
            analysis.tests.test_foundry_run_showmap_args \
            analysis.tests.test_medusa_run_config

      - name: Validate benchmark manifests
        run: |
          python scripts/validate_target_manifest.py
          python scripts/validate_known_bugs.py
          python -m unittest discover -s analysis/tests -p 'test_validate_target_manifest.py'
          python -m unittest discover -s analysis/tests -p 'test_validate_known_bugs.py'
          python -m unittest discover -s analysis/tests -p 'test_known_bug_report.py'

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tarball)
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${REPO}/tar.gz/${SHA}"
          curl -fsSL "${url}" -o repo.tar.gz
          topdir="$(tar -tzf repo.tar.gz | sed -n '1p' | cut -d/ -f1)"
          tar -xzf repo.tar.gz
          shopt -s dotglob
          mv "${topdir}"/* .
          rm -rf "${topdir}" repo.tar.gz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node deps
        run: npm ci

      - name: Build docs
        run: npm run docs:build
